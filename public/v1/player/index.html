<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>React Player</title>
    <script src="/v1/shared/i18n.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@streamerbot/client/dist/streamerbot-client.js"></script>
    <script src="/v1/shared/streamerbot-actions.js"></script>
    <style>
        html,
        body,
        #mediaRoot,
        #youtubePlayer,
        #twitchClipPlayer,
        #medalPlayer,
        #tiktokPlayer {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        body {
            position: relative;
        }

        #mediaRoot {
            position: relative;
        }

        #youtubePlayer,
        #youtubePlayer iframe,
        #twitchClipPlayer,
        #twitchClipPlayer iframe,
        #medalPlayer,
        #medalPlayer iframe,
        #tiktokPlayer,
        #tiktokPlayer iframe {
            position: absolute;
            inset: 0;
            width: 100% !important;
            height: 100% !important;
            border: 0;
        }

        #twitchClipPlayer,
        #medalPlayer,
        #tiktokPlayer {
            display: none;
            background: #000;
        }


        #interactionSurface {
            position: absolute;
            inset: 0;
            z-index: 10;
            outline: none;
            cursor: default;
        }

        #customControls {
            position: absolute;
            left: 18px;
            right: 18px;
            bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 4px;
            opacity: 0;
            transform: translateY(5px);
            transition: opacity 120ms ease, transform 120ms ease;
            pointer-events: none;
        }

        #interactionSurface.controls-visible #customControls {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        #overlayPlayButton {
            flex: 0 0 auto;
            width: 28px;
            height: 28px;
            padding: 0;
            border: 0;
            background: transparent;
            color: #fff;
            font-size: 19px;
            line-height: 28px;
            text-align: center;
            cursor: pointer;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
        }

        #seekSlider {
            flex: 1 1 auto;
            min-width: 0;
            height: 4px;
            margin: 0;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.35);
        }

        #seekSlider::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border: 0;
            border-radius: 50%;
            background: #ff1744;
            cursor: pointer;
        }

        #seekSlider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border: 0;
            border-radius: 50%;
            background: #ff1744;
            cursor: pointer;
        }


        html.audio-only,
        html.audio-only body,
        html.audio-only #mediaRoot {
            background: transparent !important;
        }

        html.audio-only #youtubePlayer,
        html.audio-only #twitchClipPlayer,
        html.audio-only #medalPlayer,
        html.audio-only #tiktokPlayer,
        html.audio-only #interactionSurface {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        html.audio-only #fallback {
            display: none !important;
        }

        #fallback {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: #fff;
            background: #000;
            font-family: Arial, sans-serif;
            text-align: center;
        }


        #preferencePlayer {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #preferencePlayer.active {
            display: block;
        }

        #preferencePlayer iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        html.audio-only #preferencePlayer.active {
            opacity: 1 !important;
            pointer-events: auto !important;
            background: #000 !important;
        }
    </style>
</head>
<body>
<div id="mediaRoot">
    <div id="youtubePlayer"></div>
    <div id="twitchClipPlayer"></div>
    <div id="medalPlayer"></div>
    <div id="tiktokPlayer"></div>

    <div id="interactionSurface" tabindex="0" aria-label="Video controls" data-i18n-aria-label="player.controls">
        <div id="customControls">
            <button id="overlayPlayButton" type="button" aria-label="Play or pause" data-i18n-aria-label="player.playPause">▶</button>
            <input id="seekSlider" type="range" min="0" max="100" value="0" step="0.1" aria-label="Video position" data-i18n-aria-label="player.videoPosition">
        </div>
    </div>
</div>
<div id="fallback"></div>
<div id="preferencePlayer" hidden aria-hidden="true"></div>

<script>
    const CURRENT_GLOBAL = "ReactCurrent";
    const COMMAND_GLOBAL = "ReactPlayerCommand";
    const VOLUME_GLOBAL = "ReactPlayerVolume";
    const MUTED_GLOBAL = "ReactPlayerMuted";
    const VIDEO_HIDDEN_GLOBAL = "ReactPlayerVideoHidden";
    const reactActions =
        window.ReactPlayerActions;

    let streamerBotConnected = false;
    let selectedPlayer = false;
    let client;

    client = new StreamerbotClient({
        host: "127.0.0.1",
        port: 8080,
        endpoint: "/",

        onConnect: async () => {
            streamerBotConnected = true;
            playbackSettingsReadAt = 0;

            try {
                await reactActions.resolve(
                    client
                );

                await reactActions.run(
                    client,
                    "control",
                    { operation: "init" }
                );

                await reactActions.run(client, "control", { operation: "playerconnected", playerUrl: location.href });

                await syncFromStreamerBot();
                await syncPlayerCommand();
                if (!currentRequest) warmNextYouTubeVideo();
            } catch (error) {
                console.error("React Player initialization failed:", error);
            }
        },

        onDisconnect: () => {
            streamerBotConnected = false;
        },

        onError: (error) => {
            console.error("React Player Streamer.bot client error:", error);
        }
    });

    client.on("Raw.ActionCompleted", async ({ data }) => {
        if (reactActions.matches(data, "control") &&
            ["init", "playbacksettings", "fallbackpower", "stop"].includes(String((data.arguments || {}).operation || "").toLowerCase())) {
            playbackSettingsReadAt = 0;
        }
        if (!streamerBotConnected || !selectedPlayer || !reactActions.matches(data, "addLink")) return;
        const args = data.arguments || {};
        if (!parseBool(args.reactSubmitSuccess) || !args.reactRequestId) return;
        warmNextYouTubeVideo();
        try {
            await reactActions.run(client, "control", {
                operation: "requestadded",
                playerUrl: location.href,
                requestId: args.reactRequestId,
                queueWasEmpty: parseBool(args.reactQueueWasEmpty)
            });
        } catch (error) {
            console.error("Could not start the new request:", error);
        }
    });

    const mediaRoot = document.getElementById("mediaRoot");
    const twitchClipPlayer = document.getElementById("twitchClipPlayer");
    const medalPlayer = document.getElementById("medalPlayer");
    const tiktokPlayer = document.getElementById("tiktokPlayer");
    const fallback = document.getElementById("fallback");
    const preferencePlayer = document.getElementById("preferencePlayer");
    const interactionSurface = document.getElementById("interactionSurface");
    const customControls = document.getElementById("customControls");
    const overlayPlayButton = document.getElementById("overlayPlayButton");
    const seekSlider = document.getElementById("seekSlider");

    const PLAYER_ERROR_FALLBACKS = Object.freeze({
        "player.error.invalidTikTok": "Invalid TikTok video.",
        "player.error.invalidMedal": "Invalid Medal clip.",
        "player.error.invalidTwitch": "Invalid Twitch Clip.",
        "player.error.unsupportedMedia":
            "This media type is not supported by React Player yet."
    });

    const playerI18n =
        window.ReactPlayerI18n || null;

    let ytApiReady = false;
    let ytApiLoading = false;
    let ytPlayer = null;
    let ytPlayerReady = false;
    let ytPlayerHost = "";
    let pendingYouTubeLoad = null;
    let youtubeLoadSequence = 0;
    const youtubePolicyCache = new Map();
    let youtubeWarmupBusy = false;

    let currentRequest = null;
    let loadedRequestId = "";
    let playbackSession = "";
    let lastCommandNonce = "";
    let commandInitialized = false;
    let lastReportedState = "";
    let lastAppliedVolume = -1;
    let desiredMuted = false;
    let videoHidden = false;
    let controlsHideTimer = null;
    let seeking = false;
    let syncing = false;
    let commandSyncing = false;
    let telemetryBusy = false;
    let nonInteractiveEndTimer = null;
    let tiktokIframe = null;
    let tiktokCurrentTime = 0;
    let tiktokDuration = 0;
    let tiktokPlayerState = -1;
    let tiktokActualMuted = null;
    let tiktokUnmuteAttempts = 0;
    let activeFallbackKey = "";
    let preferenceRequest = null;
    let pendingPreferenceCommand = null;
    let playbackLimitSeconds = 0;
    let playbackElapsed = 0;
    let playbackTick = performance.now();
    let playbackLimitReached = false;
    let playlistVideoId = "";
    let playlistCursor = { id: "", index: 0, seconds: 0, order: [], originalOrder: [], shuffle: false };
    let fallbackShuffle = false;
    let fallbackRandomStart = false;
    let fallbackEnabled = false;
    let fallbackStopped = false;
    let playbackSettingsReadAt = 0;
    let pendingPlaylistShuffle = false;
    let pendingPlaylistStart = false;
    let playlistStarting = false;
    let pendingRandomStart = false;

    function isPlaylist(request = currentRequest) {
        return request && request.Provider === "youtube" && request.MediaType === "playlist";
    }

    function isCurrentYouTubePlaylist() {
        try {
            return new URL(ytPlayer.getVideoUrl()).searchParams.get("list") === currentRequest.ContentId;
        } catch {
            return false;
        }
    }

    function resetPlaybackLimit() {
        playbackElapsed = 0;
        playbackTick = performance.now();
        playbackLimitReached = false;
    }

    function checkPlaybackLimit() {
        const now = performance.now();
        if (currentRequest && lastReportedState === "playing" && !playbackLimitReached) {
            playbackElapsed += (now - playbackTick) / 1000;
        }
        playbackTick = now;
        if (!currentRequest || !playbackLimitSeconds || playbackLimitReached ||
            playbackElapsed < playbackLimitSeconds) return;
        playbackLimitReached = true;
        if (isPlaylist() && ytPlayerReady) {
            nextFallbackVideo();
        } else {
            stopMedia(false);
            reportState("ended");
        }
    }

    function nextFallbackVideo() {
        if (!isPlaylist() || !ytPlayerReady) return;
        playlistVideoId = "";
        playlistStarting = true;
        resetPlaybackLimit();
        const playlist = ytPlayer.getPlaylist() || [];
        const index = Number(ytPlayer.getPlaylistIndex() || 0);
        ytPlayer.playVideoAt(playlist.length ? (index + 1) % playlist.length : 0);
    }

    function translatePlayerText(key) {
        if (
            playerI18n &&
            typeof playerI18n.t === "function"
        ) {
            try {
                const translated =
                    playerI18n.t(key);

                if (
                    typeof translated === "string" &&
                    translated &&
                    translated !== key
                ) {
                    return translated;
                }
            } catch (error) {
            }
        }

        return PLAYER_ERROR_FALLBACKS[key] || key;
    }

    function applyPlayerLocalization() {
        if (!playerI18n) {
            return;
        }

        if (
            typeof playerI18n.getLanguage === "function"
        ) {
            try {
                const language =
                    playerI18n.getLanguage();

                if (language) {
                    document.documentElement.lang =
                        language;
                }
            } catch (error) {
            }
        }

        if (
            typeof playerI18n.translateDocument === "function"
        ) {
            try {
                playerI18n.translateDocument(document);
            } catch (error) {
            }
        }

        if (activeFallbackKey) {
            fallback.textContent =
                translatePlayerText(activeFallbackKey);
        }
    }

    function initializePlayerLocalization() {
        if (!playerI18n) {
            return;
        }

        if (
            typeof playerI18n.onChange === "function"
        ) {
            try {
                playerI18n.onChange(
                    applyPlayerLocalization
                );
            } catch (error) {
            }
        }

        if (typeof playerI18n.init !== "function") {
            applyPlayerLocalization();
            return;
        }

        try {
            Promise.resolve(playerI18n.init()).then(
                applyPlayerLocalization,
                applyPlayerLocalization
            );
        } catch (error) {
            applyPlayerLocalization();
        }
    }

    initializePlayerLocalization();

    function getGlobalValue(response) {
        if (!response || !response.variable) {
            return null;
        }

        return response.variable.value;
    }

    function parseJson(value, fallbackValue) {
        if (value === undefined || value === null || value === "") {
            return fallbackValue;
        }

        if (typeof value === "object") {
            return value;
        }

        try {
            return JSON.parse(value);
        } catch (error) {
            console.error("React Player JSON parse failed:", error);
            return fallbackValue;
        }
    }

    function parseStartSeconds(url) {
        if (!url) {
            return 0;
        }

        try {
            const parsed = new URL(url);
            const raw = parsed.searchParams.get("t") || parsed.searchParams.get("start");

            if (!raw) {
                return 0;
            }

            if (/^\d+$/.test(raw)) {
                return Number(raw);
            }

            const match = raw.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/i);

            if (!match) {
                return 0;
            }

            return (
                (Number(match[1] || 0) * 3600) +
                (Number(match[2] || 0) * 60) +
                Number(match[3] || 0)
            );
        } catch (error) {
            return 0;
        }
    }

    async function reportState(state) {
        if (!streamerBotConnected || !selectedPlayer) return;
        if (playbackLimitReached && state !== "ended") {
            if (state === "playing") pauseMedia();
            return;
        }
        if (state === lastReportedState) {
            return;
        }

        lastReportedState = state;

        try {
            await reactActions.run(
                client,
                "control",
                {
                    operation: "playerstate",
                    playerUrl: location.href,
                    state: state,
                    sessionId: playbackSession,
                    requestId: currentRequest ? currentRequest.Id : ""
                }
            );
        } catch (error) {
            console.error("Could not report React Player state:", error);
        }
    }

    async function reportExternalTelemetry(
        currentTime,
        duration,
        buffered = 0)
    {
        if (
            !streamerBotConnected ||
            !selectedPlayer ||
            !currentRequest
        ) {
            return;
        }

        try {
            await reactActions.run(
                client,
                "control",
                {
                    operation: "telemetry",
                    playerUrl: location.href,
                    sessionId: playbackSession,
                    requestId:
                        currentRequest.Id || "",
                    currentTime:
                        Math.max(
                            0,
                            Number(currentTime || 0)
                        ),
                    duration:
                        Math.max(
                            0,
                            Number(duration || 0)
                        ),
                    buffered:
                        Math.max(
                            0,
                            Math.min(
                                1,
                                Number(buffered || 0)
                            )
                        )
                }
            );
        } catch (error) {
            console.error(
                "Could not report external React Player telemetry:",
                error
            );
        }
    }

    async function reportTelemetry() {
        if (
            !streamerBotConnected ||
            !selectedPlayer ||
            !currentRequest ||
            currentProvider() !== "youtube" ||
            !ytPlayerReady ||
            !ytPlayer || loadedRequestId !== currentRequest.Id
        ) {
            return;
        }

        let reporting = false;

        try {
            let currentTime = Number(ytPlayer.getCurrentTime() || 0);
            const duration = Number(ytPlayer.getDuration() || 0);
            const buffered = Number(ytPlayer.getVideoLoadedFraction() || 0);
            const video = ytPlayer.getVideoData() || {};
            if (!Number.isFinite(duration) || duration <= 0 || !video.video_id ||
                (!isPlaylist() && video.video_id !== currentRequest.ContentId)) return;
            const playlistOrderReady = !isPlaylist() ||
                ytPlayer.getPlayerState() !== YT.PlayerState.PAUSED || playlistCursor.shuffle === fallbackShuffle;
            if (isPlaylist()) {
                if (!isCurrentYouTubePlaylist() || playlistStarting || pendingPlaylistShuffle ||
                    ytPlayer.getPlayerState() === YT.PlayerState.ENDED) return;
                if (playlistVideoId !== video.video_id) {
                    playlistVideoId = video.video_id;
                    pendingRandomStart = true;
                    resetPlaybackLimit();
                }
                if (pendingRandomStart && ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
                    pendingRandomStart = false;
                    if (fallbackRandomStart) {
                        currentTime = Math.floor(Math.random() * Math.max(0, duration - (playbackLimitSeconds || 1)));
                        resetPlaybackLimit();
                        ytPlayer.seekTo(currentTime, true);
                    }
                }
                playlistCursor = {
                    id: currentRequest.ContentId,
                    index: Number(ytPlayer.getPlaylistIndex() || 0),
                    seconds: currentTime,
                    order: ytPlayer.getPlaylist() || [],
                    originalOrder: playlistCursor.originalOrder,
                    shuffle: playlistOrderReady ? fallbackShuffle : playlistCursor.shuffle
                };
            }

            if (telemetryBusy) return;
            telemetryBusy = true;
            reporting = true;
            await reactActions.run(
                client,
                "control",
                {
                    operation: "telemetry",
                    playerUrl: location.href,
                    sessionId: playbackSession,
                    requestId: currentRequest.Id || "",
                    currentTime: currentTime,
                    duration: duration,
                    buffered: buffered,
                    videoId: isPlaylist() ? video.video_id || "" : "",
                    nextVideoId: isPlaylist() && playlistOrderReady && playlistCursor.order[playlistCursor.index] === video.video_id
                        ? playlistCursor.order[(playlistCursor.index + 1) % playlistCursor.order.length] : "",
                    videoTitle: isPlaylist() ? video.title || "YouTube" : ""
                }
            );
        } catch (error) {
            console.error("Could not report React Player telemetry:", error);
        } finally {
            if (reporting) telemetryBusy = false;
        }
    }

    function parseBool(value) {
        if (typeof value === "boolean") {
            return value;
        }

        if (typeof value === "number") {
            return value !== 0;
        }

        return String(
            value || ""
        ).toLowerCase() === "true";
    }

    function mapYouTubeState(state) {
        if (!window.YT || !window.YT.PlayerState) {
            return "idle";
        }

        switch (state) {
            case YT.PlayerState.PLAYING:
                return "playing";
            case YT.PlayerState.PAUSED:
                return "paused";
            case YT.PlayerState.ENDED:
                return "ended";
            case YT.PlayerState.BUFFERING:
                return "loading";
            case YT.PlayerState.CUED:
                return "paused";
            default:
                return currentRequest ? "loading" : "idle";
        }
    }

    function onYouTubeStateChange(event) {
        if (!currentRequest || currentProvider() !== "youtube" || event.target !== ytPlayer) {
            return;
        }
        if (isPlaylist() && !isCurrentYouTubePlaylist()) return;

        if (isPlaylist() && event.data === YT.PlayerState.ENDED) {
            playlistVideoId = "";
            playlistStarting = true;
            resetPlaybackLimit();
            reportState("loading");
            const playlist = ytPlayer.getPlaylist() || [];
            if (playlist.length && ytPlayer.getPlaylistIndex() === playlist.length - 1) {
                ytPlayer.playVideoAt(0);
            }
            return;
        }
        if (isPlaylist() && pendingPlaylistShuffle &&
            (event.data === YT.PlayerState.PLAYING || event.data === YT.PlayerState.CUED)) {
            const order = ytPlayer.getPlaylist() || [];
            if (order.length) {
                playlistCursor.originalOrder = order.slice();
                pendingPlaylistShuffle = false;
                ytPlayer.setShuffle(fallbackShuffle);
                if (pendingPlaylistStart) {
                    pendingPlaylistStart = false;
                    ytPlayer.playVideoAt(fallbackShuffle ? Math.floor(Math.random() * order.length) : 0);
                    return;
                }
            }
        }
        const video = ytPlayer.getVideoData();
        if (!isPlaylist() && video && video.video_id && video.video_id !== currentRequest.ContentId) return;
        if (isPlaylist() && event.data === YT.PlayerState.PLAYING) playlistStarting = false;

        reportState(mapYouTubeState(event.data));
        reportTelemetry();
        applyDesiredMuteState();
    }

    function onYouTubeError(event) {
        if (event.target !== ytPlayer || !currentRequest || currentProvider() !== "youtube") return;
        console.error("YouTube player error:", event.data);
        reportState("error");
    }

    async function getYouTubePolicy(videoId) {
        const cleanId = String(videoId || "").trim();

        if (!cleanId) {
            return { madeForKids: true, checked: false };
        }

        if (youtubePolicyCache.has(cleanId)) {
            return youtubePolicyCache.get(cleanId);
        }

        const request = (async () => {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 1500);
            try {
                const response = await fetch(
                    "/api/youtube/video?id=" +
                    encodeURIComponent(cleanId),
                    { signal: controller.signal }
                );

                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }

                const payload = await response.json();
                const item =
                    payload &&
                    Array.isArray(payload.items) &&
                    payload.items.length > 0
                        ? payload.items[0]
                        : null;

                if (!item) {
                    throw new Error("video_status_unavailable");
                }

                return {
                    madeForKids: Boolean(
                        item.status &&
                        item.status.madeForKids === true
                    ),
                    checked: true
                };
            } catch (error) {
                youtubePolicyCache.delete(cleanId);

                console.warn(
                    "Could not check YouTube Made for Kids status; using privacy-enhanced playback:",
                    error
                );

                return { madeForKids: true, checked: false };
            } finally {
                clearTimeout(timeout);
            }
        })();

        youtubePolicyCache.set(cleanId, request);
        return request;
    }

    async function warmNextYouTubeVideo() {
        if (!streamerBotConnected || !selectedPlayer || youtubeWarmupBusy) return;
        youtubeWarmupBusy = true;
        try {
            const response = await client.getGlobal("ReactQueue", true);
            if (!selectedPlayer) return;
            const queue = parseJson(getGlobalValue(response), []);
            const next = queue.find(request => request.Provider === "youtube" &&
                request.MediaType !== "playlist" && request.Id !== (currentRequest && currentRequest.Id));
            if (next) {
                loadYouTubeApi();
                getYouTubePolicy(next.ContentId);
            }
        } catch (error) {
            console.warn("Could not prepare the next YouTube video:", error);
        } finally {
            youtubeWarmupBusy = false;
        }
    }

    function loadYouTubeApi() {
        if (ytApiReady || ytApiLoading) {
            return;
        }

        ytApiLoading = true;

        const youtubeApiScript = document.createElement("script");
        youtubeApiScript.src = "https://www.youtube.com/iframe_api";
        youtubeApiScript.addEventListener("error", () => {
            ytApiLoading = false;
            console.error("Could not load the YouTube IFrame API.");
            if (currentProvider() === "youtube") reportState("error");
        });

        document.head.appendChild(youtubeApiScript);
    }

    function destroyYouTubePlayer() {
        if (ytPlayer) {
            try {
                ytPlayer.destroy();
            } catch (error) {
                console.warn("Could not destroy the previous YouTube player:", error);
            }
        }

        ytPlayer = null;
        ytPlayerReady = false;
        ytPlayerHost = "";

        const container = document.getElementById("youtubePlayer");
        if (container) {
            container.replaceChildren();
        }
    }

    function createYouTubePlayer(request, usePrivacyHost) {
        const container = document.getElementById("youtubePlayer");

        if (!container || !request || !request.ContentId) {
            reportState("error");
            return;
        }

        destroyYouTubePlayer();

        const host = usePrivacyHost
            ? "https://www.youtube-nocookie.com"
            : "https://www.youtube.com";

        const startSeconds = parseStartSeconds(
            request.Url || request.OriginalUrl || ""
        );

        const params = new URLSearchParams({
            autoplay: "1",
            controls: "0",
            cc_lang_pref: "en",
            disablekb: "1",
            enablejsapi: "1",
            fs: "0",
            iv_load_policy: "3",
            playsinline: "1",
            rel: "0",
            origin: window.location.origin
        });

        if (isPlaylist(request)) {
            params.set("listType", "playlist");
            params.set("list", request.ContentId);
            params.set("loop", "1");
            params.set("autoplay", "0");
        }

        if (startSeconds > 0) {
            params.set("start", String(startSeconds));
        }

        const iframe = document.createElement("iframe");
        iframe.id = "youtubePlayerFrame";
        iframe.src =
            host +
            "/embed" +
            (isPlaylist(request) ? "" : "/" + encodeURIComponent(request.ContentId)) +
            "?" +
            params.toString();
        iframe.title = "YouTube video player";
        iframe.setAttribute(
            "allow",
            "autoplay; encrypted-media; picture-in-picture"
        );
        iframe.setAttribute("frameborder", "0");

        container.appendChild(iframe);

        ytPlayerHost = host;
        loadedRequestId = request.Id;
        reportState("loading");

        ytPlayer = new YT.Player(iframe, {
            events: {
                onReady: function (event) {
                    if (event.target !== ytPlayer) return;
                    ytPlayerReady = true;

                    if (lastAppliedVolume >= 0) {
                        ytPlayer.setVolume(lastAppliedVolume);
                    }

                    applyDesiredMuteState();

                    if (pendingYouTubeLoad) {
                        const pending = pendingYouTubeLoad;
                        pendingYouTubeLoad = null;

                        performYouTubeLoad(
                            pending.request,
                            true,
                            pending.usePrivacyHost
                        );
                    } else if (isPlaylist(request) && currentRequest && currentRequest.Id === request.Id) {
                        loadYouTubePlaylist(request);
                    }
                },
                onStateChange: onYouTubeStateChange,
                onError: onYouTubeError
            }
        });
    }

    function performYouTubeLoad(request, forceReload, usePrivacyHost) {
        const host = usePrivacyHost
            ? "https://www.youtube-nocookie.com"
            : "https://www.youtube.com";

        if (!ytApiReady) {
            pendingYouTubeLoad = {
                request,
                forceReload,
                usePrivacyHost
            };
            loadYouTubeApi();
            return;
        }

        if (!ytPlayer || ytPlayerHost !== host ||
            (isPlaylist(request) && playlistCursor.id !== request.ContentId)) {
            pendingYouTubeLoad = null;
            createYouTubePlayer(request, usePrivacyHost);
            return;
        }

        if (!ytPlayerReady) {
            pendingYouTubeLoad = {
                request,
                forceReload,
                usePrivacyHost
            };
            return;
        }

        if (!forceReload && loadedRequestId === request.Id) {
            pendingYouTubeLoad = null;
            return;
        }

        const startSeconds = parseStartSeconds(
            request.Url || request.OriginalUrl || ""
        );

        pendingYouTubeLoad = null;
        loadedRequestId = request.Id;
        reportState("loading");

        if (isPlaylist(request)) {
            loadYouTubePlaylist(request);
            return;
        }

        ytPlayer.setLoop(false);

        ytPlayer.loadVideoById({
            videoId: request.ContentId,
            startSeconds
        });
    }

    function loadYouTubePlaylist(request) {
        const resume = playlistCursor.id === request.ContentId;
        const videoId = resume ? playlistCursor.order[playlistCursor.index] : "";
        const originalIndex = resume ? playlistCursor.originalOrder.indexOf(videoId) : -1;
        pendingPlaylistShuffle = true;
        pendingPlaylistStart = !resume && fallbackShuffle;
        playlistStarting = true;
        playlistVideoId = videoId || "";
        pendingRandomStart = !resume;
        if (!resume) {
            playlistCursor = { id: request.ContentId, index: 0, seconds: 0, order: [], originalOrder: [], shuffle: fallbackShuffle };
        }
        ytPlayer[pendingPlaylistStart ? "cuePlaylist" : "loadPlaylist"]({
            listType: "playlist", list: request.ContentId,
            index: Math.max(0, originalIndex), startSeconds: resume ? playlistCursor.seconds : 0
        });
        ytPlayer.setLoop(true);
    }

    async function getYouTubeHost(request) {
        if (isPlaylist(request)) return "https://www.youtube.com";
        const policy = await getYouTubePolicy(request.ContentId);
        return policy.madeForKids ? "https://www.youtube-nocookie.com" : "https://www.youtube.com";
    }

    function closePreferencePlayer() {
        pendingPreferenceCommand = null;

    function getPreferenceTwitchParentQuery() {
        const parents = [];

        const hostname =
            String(
                window.location.hostname ||
                ""
            ).trim();

        if (hostname) {
            parents.push(hostname);
        }

        if (!parents.includes("localhost")) {
            parents.push("localhost");
        }

        if (!parents.includes("127.0.0.1")) {
            parents.push("127.0.0.1");
        }

        return parents
            .map(
                (parent) =>
                    "parent=" +
                    encodeURIComponent(parent)
            )
            .join("&");
    }

    async function openPreferencePlayer(command) {
        const provider =
            String(
                command &&
                command.Provider
                    ? command.Provider
                    : ""
            ).trim().toLowerCase();

        const contentId =
            String(
                command &&
                command.ContentId
                    ? command.ContentId
                    : ""
            ).trim();

        const url =
            String(
                command &&
                command.Url
                    ? command.Url
                    : ""
            ).trim();

        if (
            !contentId ||
            ![
                "youtube",
                "twitch",
                "medal",
                "tiktok"
            ].includes(provider)
        ) {
            closePreferencePlayer();

            console.warn(
                "Playback settings received unsupported media."
            );

            return;
        }

        let source = "";
        let title = "Playback settings";

        if (provider === "youtube") {
            const startSeconds =
                parseStartSeconds(url);

            const playlist = new URL(url).searchParams.get("list") === contentId;
            const youtubeHost = await getYouTubeHost({
                Provider: "youtube", MediaType: playlist ? "playlist" : "video", ContentId: contentId
            });

            source =
                youtubeHost +
                (playlist ? "/embed" : "/embed/" + encodeURIComponent(contentId)) +
                "?autoplay=0" +
                (playlist ? "&listType=playlist&list=" + encodeURIComponent(contentId) : "") +
                "&controls=1" +
                "&disablekb=0" +
                "&enablejsapi=1" +
                "&fs=1" +
                "&playsinline=1" +
                "&origin=" +
                encodeURIComponent(
                    window.location.origin
                );

            if (startSeconds > 0) {
                source +=
                    "&start=" +
                    encodeURIComponent(
                        String(startSeconds)
                    );
            }

            title =
                "YouTube playback settings";
        } else if (provider === "twitch") {
            source =
                "https://clips.twitch.tv/embed" +
                "?clip=" +
                encodeURIComponent(contentId) +
                "&" +
                getPreferenceTwitchParentQuery() +
                "&autoplay=false";

            title =
                "Twitch Clip playback settings";
        } else if (provider === "medal") {
            source =
                "https://medal.tv/clip/" +
                encodeURIComponent(contentId) +
                "?autoplay=0" +
                "&loop=0";

            title =
                "Medal playback settings";
        } else {
            source =
                "https://www.tiktok.com/player/v1/" +
                encodeURIComponent(contentId) +
                "?autoplay=0" +
                "&loop=0" +
                "&controls=1";

            title =
                "TikTok playback settings";
        }

        closePreferencePlayer();

        const iframe =
            document.createElement("iframe");

        iframe.src = source;
        iframe.title = title;

        iframe.setAttribute(
            "allow",
            "autoplay; encrypted-media; fullscreen; picture-in-picture"
        );

        iframe.setAttribute(
            "allowfullscreen",
            ""
        );

        iframe.setAttribute(
            "frameborder",
            "0"
        );

        preferenceRequest = {
            Provider: provider,
            ContentId: contentId,
            Url: url
        };

        preferencePlayer.appendChild(iframe);
        preferencePlayer.hidden = false;
        preferencePlayer.classList.add("active");
        preferencePlayer.setAttribute(
            "aria-hidden",
            "false"
        );

        document.documentElement.classList.add(
            "preference-mode"
        );
    }

    function clearNonInteractiveEndTimer() {
        if (nonInteractiveEndTimer) {
            clearTimeout(
                nonInteractiveEndTimer
            );

            nonInteractiveEndTimer = null;
        }
    }

    function scheduleNonInteractiveEnd(request) {
        clearNonInteractiveEndTimer();

        const durationSeconds =
            Math.max(
                0,
                Number(
                    request &&
                    request.DurationSeconds
                        ? request.DurationSeconds
                        : 0
                )
            );

        if (durationSeconds <= 0) {
            return;
        }

        const delayMs =
            Math.round(
                durationSeconds * 1000
            ) +
            1250;

        nonInteractiveEndTimer =
            setTimeout(
                () => {
                    nonInteractiveEndTimer = null;

                    if (
                        currentRequest &&
                        currentRequest.Id === request.Id &&
                        (
                            currentProvider() === "twitch" ||
                            currentProvider() === "medal"
                        )
                    ) {
                        reportState(
                            "ended"
                        );
                    }
                },
                delayMs
            );
    }

    function sendTikTokCommand(
        type,
        value)
    {
        if (
            !tiktokIframe ||
            !tiktokIframe.contentWindow
        ) {

        const message = {
            type: type,
            "x-tiktok-player": true
        };

        if (value !== undefined) {
            message.value = value;
        }

        tiktokIframe.contentWindow.postMessage(
            message,
            "*"
        );

    async function loadYouTube(request, forceReload) {
        hideFallback();
        clearNonInteractiveEndTimer();
        clearTwitchClip();
        clearMedal();
        clearTikTok();
        showYouTubePlayer();

        if (!request || !request.ContentId) {
            reportState("error");
            return;
        }

        if (!forceReload && loadedRequestId === request.Id) {
            return;
        }

        const sequence = ++youtubeLoadSequence;
        pendingYouTubeLoad = null;
        loadYouTubeApi();
        const host = await getYouTubeHost(request);

        if (
            sequence !== youtubeLoadSequence ||
            !currentRequest ||
            currentRequest.Id !== request.Id
        ) {
            return;
        }

        performYouTubeLoad(
            request,
            forceReload,
            host === "https://www.youtube-nocookie.com"
        );
    }

    function loadCurrentMedia(forceReload = false) {
        if (!currentRequest) {
            stopMedia();
            return;
        }

        resetPlaybackLimit();
        lastReportedState = "";
        playlistVideoId = "";

        const provider = String(currentRequest.Provider || "").toLowerCase();

        if (provider === "youtube") {
            loadYouTube(currentRequest, forceReload);
            return;
        }

        if (provider === "twitch") {
            loadTwitchClip(
                currentRequest,
                forceReload
            );

            return;
        }

        if (provider === "medal") {
            loadMedalClip(
                currentRequest,
                forceReload
            );

            return;
        }

        if (provider === "tiktok") {
            loadTikTokVideo(
                currentRequest,
                forceReload
            );

            return;
        }

        showFallback("player.error.unsupportedMedia");
        reportState("error");
    }

    function pauseMedia() {
        if (!currentRequest) {
            return;
        }

        if (
            currentProvider() === "youtube" &&
            ytPlayerReady &&
            ytPlayer
        ) {
            ytPlayer.pauseVideo();
            return;
        }

        if (currentProvider() === "tiktok") {
            sendTikTokCommand("pause");
        }
    }

    function playMedia() {
        if (!currentRequest) {
            return;
        }

        if (playbackLimitReached) {
            reactActions.run(client, "control", { operation: "play", id: currentRequest.Id })
                .catch(error => console.error("Could not replay the request:", error));
            return;
        }

        if (
            currentProvider() === "youtube" &&
            ytPlayerReady &&
            ytPlayer
        ) {
            ytPlayer.playVideo();
            return;
        }

        if (currentProvider() === "tiktok") {
            sendTikTokCommand("play");
        }
    }

    function stopMedia(reportIdle = true) {
        ++youtubeLoadSequence;
        pendingYouTubeLoad = null;
        loadedRequestId = "";
        hideFallback();
        clearNonInteractiveEndTimer();
        clearTwitchClip();
        clearMedal();
        clearTikTok();
        showYouTubePlayer();

        if (ytPlayerReady && ytPlayer) {
            try {
                ytPlayer.stopVideo();
            } catch (error) {
                console.error("Could not stop YouTube player:", error);
            }
        }

        if (reportIdle) reportState("idle");
    }

    function clampVolume(value) {
        const number = Number(value);

        if (!Number.isFinite(number)) {
            return 100;
        }

        return Math.max(0, Math.min(100, Math.round(number)));
    }

    function applyVolume(value) {
        const volume = clampVolume(value);

        if (volume === lastAppliedVolume) {
            return;
        }

        lastAppliedVolume = volume;

        if (ytPlayerReady && ytPlayer) {
            ytPlayer.setVolume(volume);
        }
    }

    function applyVideoHiddenState() {
        const provider =
            currentProvider();

        const canHideVideo =
            provider !== "twitch";

        document.documentElement.classList.toggle(
            "audio-only",
            videoHidden &&
            canHideVideo
        );
    }

    function applyDesiredMuteState() {
        if (!currentRequest) {
            return;
        }

        const provider =
            currentProvider();

        if (
            provider === "youtube" &&
            ytPlayerReady &&
            ytPlayer
        ) {
            try {
                if (ytPlayer.isMuted() !== desiredMuted) {
                    if (desiredMuted) {
                        ytPlayer.mute();
                    } else {
                        ytPlayer.unMute();
                    }
                }
            } catch (error) {
                console.warn(
                    "Could not apply YouTube mute state:",
                    error
                );
            }

            return;
        }

        if (provider === "tiktok") {
            sendTikTokCommand(
                desiredMuted
                    ? "mute"
                    : "unMute"
            );
        }
    }

    function reinforceTikTokMuteState(
        force = false)
    {
        if (
            !currentRequest ||
            currentProvider() !== "tiktok"
        ) {
            return;
        }

        const requestId =
            currentRequest.Id || "";

        if (desiredMuted) {
            sendTikTokCommand(
                "mute"
            );

            return;
        }

        if (
            !force &&
            tiktokActualMuted === false
        ) {
            return;
        }

        if (
            tiktokUnmuteAttempts >= 8
        ) {
            return;
        }

        tiktokUnmuteAttempts += 1;

        const retryDelay =
            tiktokUnmuteAttempts <= 2
                ? 0
                : Math.min(
                    1600,
                    150 * tiktokUnmuteAttempts
                );

        setTimeout(
            () => {
                if (
                    !currentRequest ||
                    currentRequest.Id !== requestId ||
                    currentProvider() !== "tiktok" ||
                    desiredMuted
                ) {
                    return;
                }

                sendTikTokCommand(
                    "unMute"
                );
            },
            retryDelay
        );
    }

    function togglePlayback() {
        if (!ytPlayerReady || !ytPlayer || !currentRequest) {
            return;
        }

        const state = ytPlayer.getPlayerState();

        if (state === YT.PlayerState.PLAYING) {
            ytPlayer.pauseVideo();
        } else {
            playMedia();
        }
    }

    function seekAbsolute(seconds) {
        if (!currentRequest) {
            return;
        }

        const requested =
            Number(seconds || 0);

        if (
            currentProvider() === "youtube" &&
            ytPlayerReady &&
            ytPlayer
        ) {
            const duration =
                Number(
                    ytPlayer.getDuration() || 0
                );

            const nextTime = Math.max(
                0,
                duration > 0
                    ? Math.min(
                        duration,
                        requested
                    )
                    : requested
            );

            ytPlayer.seekTo(
                nextTime,
                true
            );

            setTimeout(
                reportTelemetry,
                100
            );

            return;
        }

        if (currentProvider() === "tiktok") {
            const nextTime =
                Math.max(
                    0,
                    tiktokDuration > 0
                        ? Math.min(
                            tiktokDuration,
                            requested
                        )
                        : requested
                );

            sendTikTokCommand(
                "seekTo",
                nextTime
            );
        }
    }

    function seekRelative(seconds) {
        if (!currentRequest) {
            return;
        }

        const delta =
            Number(seconds || 0);

        if (
            currentProvider() === "youtube" &&
            ytPlayerReady &&
            ytPlayer
        ) {
            const duration =
                Number(
                    ytPlayer.getDuration() || 0
                );

            const currentTime =
                Number(
                    ytPlayer.getCurrentTime() || 0
                );

            const nextTime = Math.max(
                0,
                duration > 0
                    ? Math.min(
                        duration,
                        currentTime + delta
                    )
                    : currentTime + delta
            );

            ytPlayer.seekTo(
                nextTime,
                true
            );

            setTimeout(
                reportTelemetry,
                100
            );

            return;
        }

        if (currentProvider() === "tiktok") {
            const nextTime =
                Math.max(
                    0,
                    tiktokDuration > 0
                        ? Math.min(
                            tiktokDuration,
                            tiktokCurrentTime + delta
                        )
                        : tiktokCurrentTime + delta
                );

            sendTikTokCommand(
                "seekTo",
                nextTime
            );
        }
    }

    function showControls() {
        interactionSurface.classList.add("controls-visible");

        if (controlsHideTimer) {
            clearTimeout(controlsHideTimer);
        }

        controlsHideTimer = setTimeout(() => {
            if (!seeking) {
                interactionSurface.classList.remove("controls-visible");
            }
        }, 1600);
    }

    function updateTimeline() {
        if (
            currentProvider() !== "youtube"
        ) {
            return;
        }

        if (!ytPlayerReady || !ytPlayer || !currentRequest || seeking) {
            return;
        }

        const duration = Number(ytPlayer.getDuration() || 0);
        const currentTime = Number(ytPlayer.getCurrentTime() || 0);

        if (duration > 0) {
            seekSlider.max = String(duration);
            seekSlider.value = String(Math.max(0, Math.min(duration, currentTime)));
        } else {
            seekSlider.max = "100";
            seekSlider.value = "0";
        }

        const state = ytPlayer.getPlayerState();
        overlayPlayButton.textContent =
            state === YT.PlayerState.PLAYING ? "Ⅱ" : "▶";
    }

    interactionSurface.addEventListener("mousemove", showControls);

    interactionSurface.addEventListener("click", (event) => {
        if (event.target === interactionSurface) {
            togglePlayback();
            showControls();
        }
    });

    overlayPlayButton.addEventListener("click", (event) => {
        event.stopPropagation();
        togglePlayback();
        showControls();
    });

    seekSlider.addEventListener("mousedown", () => {
        seeking = true;
        showControls();
    });

    seekSlider.addEventListener("input", () => {
        showControls();
    });

    seekSlider.addEventListener("change", () => {
        if (ytPlayerReady && ytPlayer && currentRequest) {
            ytPlayer.seekTo(Number(seekSlider.value || 0), true);
        }

        seeking = false;
        showControls();
    });

    seekSlider.addEventListener("mouseup", () => {
        seeking = false;
    });

    interactionSurface.addEventListener("keydown", (event) => {
        const key = String(event.key || "").toLowerCase();

        if (key === " " || key === "k") {
            event.preventDefault();
            togglePlayback();
        } else if (key === "arrowleft") {
            event.preventDefault();
            seekRelative(-5);
        } else if (key === "arrowright") {
            event.preventDefault();
            seekRelative(5);
        } else if (key === "j") {
            event.preventDefault();
            seekRelative(-10);
        } else if (key === "l") {
            event.preventDefault();
            seekRelative(10);
        }

        showControls();
    });

    function executeCommand(command) {
        if (!command || !command.Command) {
            return;
        }

        switch (String(command.Command).toLowerCase()) {
            case "openpreferences":
                requestPreferencePlayer(command);
                break;
            case "closepreferences":
                closePreferencePlayer();
                break;
            case "load":
                closePreferencePlayer();
                syncFromStreamerBot();
                break;
            case "nextfallback":
                nextFallbackVideo();
                break;
            case "pause":
                pauseMedia();
                break;
            case "play":
                playMedia();
                break;
            case "stop":
                syncFromStreamerBot();
                break;
            case "volume":
                applyVolume(command.Value);
                break;
            case "mute":
                desiredMuted = true;
                applyDesiredMuteState();
                break;
            case "unmute":
                desiredMuted = false;
                applyDesiredMuteState();

                if (
                    currentProvider() === "tiktok"
                ) {
                    tiktokUnmuteAttempts = 0;
                    reinforceTikTokMuteState(
                        true
                    );
                }

                break;
            case "hidevideo":
                videoHidden = true;
                applyVideoHiddenState();
                break;
            case "showvideo":
                videoHidden = false;
                applyVideoHiddenState();
                break;
            case "seek":
                seekAbsolute(command.Value);
                break;
            case "seekrelative":
                seekRelative(command.Value);
                break;
        }
    }

    function normalizePlayerUrl(value) {
        const url = String(value || "").trim().split("#")[0];
        const query = url.indexOf("?");
        return query < 0 ? url.replace(/\/+$/, "") :
            url.slice(0, query).replace(/\/+$/, "") + url.slice(query);
    }

    async function syncFromStreamerBot() {
        if (!streamerBotConnected || syncing) {
            return;
        }

        syncing = true;

        try {
            const refreshSettings = Date.now() - playbackSettingsReadAt >= 3000;
            if (refreshSettings) playbackSettingsReadAt = Date.now();
            const responses = await Promise.all([
                client.getGlobal(CURRENT_GLOBAL, true),
                client.getGlobal(VOLUME_GLOBAL, true),
                client.getGlobal(MUTED_GLOBAL, true),
                client.getGlobal(VIDEO_HIDDEN_GLOBAL, true),
                client.getGlobal("ReactPlaybackSessionId", false).catch(() => null),
                client.getGlobal("ReactObsSourceUrl", true).catch(() => null),
                client.getGlobal("ReactObsDetectionStatus", true).catch(() => null),
                ...(refreshSettings ? [
                    client.getGlobal("ReactPlaybackSettings", true).catch(() => null),
                    client.getGlobal("ReactFallbackEnabled", true).catch(() => null),
                    client.getGlobal("ReactFallbackStopped", true).catch(() => null)
                ] : [])
            ]);

            const playbackSettings = refreshSettings ? parseJson(getGlobalValue(responses[7]), {}) || {} : null;
            const nextShuffle = refreshSettings ? parseBool(playbackSettings.fallbackShuffle) : fallbackShuffle;
            const shuffleChanged = fallbackShuffle !== nextShuffle;
            fallbackShuffle = nextShuffle;
            if (refreshSettings) {
                playbackLimitSeconds = Math.max(0, Number(playbackSettings.limitSeconds || 0));
                fallbackEnabled = parseBool(getGlobalValue(responses[8]));
                fallbackRandomStart = parseBool(playbackSettings.fallbackRandomStart);
                fallbackStopped = parseBool(getGlobalValue(responses[9]));
            }
            selectedPlayer = getGlobalValue(responses[6]) === "ready" &&
                normalizePlayerUrl(getGlobalValue(responses[5])) === normalizePlayerUrl(location.href);
            if (!selectedPlayer) {
                if (currentRequest || preferenceRequest || pendingYouTubeLoad) {
                    currentRequest = null;
                    closePreferencePlayer();
                    stopMedia(false);
                    resetPlaybackLimit();
                }
                playbackSession = "";
                lastReportedState = "";
                commandInitialized = false;
                return;
            }

            const nextCurrent = parseJson(getGlobalValue(responses[0]), null);
            const volume = getGlobalValue(responses[1]);
            const nextDesiredMuted =
                parseBool(
                    getGlobalValue(responses[2])
                );

            const nextVideoHidden =
                parseBool(
                    getGlobalValue(responses[3])
                );

            desiredMuted =
                nextDesiredMuted;

            videoHidden =
                nextVideoHidden;

            applyVolume(volume);
            applyVideoHiddenState();

            const oldId = currentRequest ? currentRequest.Id : "";
            const newId = nextCurrent ? nextCurrent.Id : "";
            const nextSession = String(getGlobalValue(responses[4]) || "");
            if (nextCurrent && !nextSession.startsWith(newId + ":")) return;
            const sessionChanged = playbackSession !== nextSession;
            playbackSession = nextSession;

            currentRequest = nextCurrent;
            applyVideoHiddenState();

            if (currentRequest) {
                closePreferencePlayer();
            }

            if (oldId !== newId || (currentRequest && sessionChanged && nextSession)) {
                if (currentRequest) {
                    loadCurrentMedia(true);
                    warmNextYouTubeVideo();
                } else {
                    resetPlaybackLimit();
                    stopMedia();
                }
            } else {
                if (shuffleChanged && isPlaylist() && ytPlayerReady) {
                    if (!pendingPlaylistShuffle) ytPlayer.setShuffle(fallbackShuffle);
                }
                applyDesiredMuteState();
            }

            if (
                !currentRequest &&
                pendingPreferenceCommand
            ) {
                const preferenceCommand =
                    pendingPreferenceCommand;

                pendingPreferenceCommand = null;

                openPreferencePlayer(
                    preferenceCommand
                );
            }

            if (!currentRequest && !preferenceRequest && !pendingPreferenceCommand &&
                fallbackEnabled && !fallbackStopped && (refreshSettings || oldId !== newId)) {
                await reactActions.run(client, "control", { operation: "fallback", playerUrl: location.href });
            }
        } catch (error) {
            console.error("React Player sync failed:", error);
        } finally {
            syncing = false;
        }
    }

    async function syncPlayerCommand() {
        if (!streamerBotConnected || !selectedPlayer || commandSyncing) {
            return;
        }

        commandSyncing = true;

        try {
            const response =
                await client.getGlobal(
                    COMMAND_GLOBAL,
                    false
                );

            const command =
                parseJson(
                    getGlobalValue(response),
                    null
                );

            if (!selectedPlayer) return;

            if (command && command.Nonce) {
                if (!commandInitialized) {
                    lastCommandNonce = command.Nonce;
                    commandInitialized = true;

                    if (
                        String(
                            command.Command ||
                            ""
                        ).toLowerCase() ===
                        "openpreferences"
                    ) {
                        executeCommand(command);
                    }
                } else if (command.Nonce !== lastCommandNonce) {
                    lastCommandNonce = command.Nonce;
                    executeCommand(command);
                }
            } else if (!commandInitialized) {
                commandInitialized = true;
            }
        } catch (error) {
            console.error(
                "React Player command sync failed:",
                error
            );
        } finally {
            commandSyncing = false;
        }
    }

    window.addEventListener(
        "message",
        (event) => {
            const message =
                event &&
                event.data;

            if (
                !message ||
                message["x-tiktok-player"] !== true ||
                currentProvider() !== "tiktok" ||
                !tiktokIframe || event.source !== tiktokIframe.contentWindow
            ) {
                return;
            }

            switch (message.type) {
                case "onPlayerReady":
                    reportState("loading");
                    tiktokUnmuteAttempts = 0;
                    reinforceTikTokMuteState(
                        true
                    );
                    break;

                case "onStateChange":
                    tiktokPlayerState =
                        Number(
                            message.value
                        );

                    if (tiktokPlayerState === 0) {
                        reportState("ended");
                    } else if (tiktokPlayerState === 1) {
                        reportState("playing");

                        if (
                            !desiredMuted &&
                            tiktokActualMuted !== false
                        ) {
                            reinforceTikTokMuteState(
                                true
                            );
                        }
                    } else if (tiktokPlayerState === 2) {
                        reportState("paused");
                    } else if (tiktokPlayerState === 3) {
                        reportState("loading");
                    }

                    break;

                case "onMute":
                    tiktokActualMuted =
                        Boolean(
                            message.value
                        );

                    if (
                        !desiredMuted &&
                        tiktokActualMuted
                    ) {
                        reinforceTikTokMuteState(
                            true
                        );
                    }

                    break;

                case "onCurrentTime":
                    if (
                        message.value &&
                        typeof message.value === "object"
                    ) {
                        tiktokCurrentTime =
                            Math.max(
                                0,
                                Number(
                                    message.value.currentTime || 0
                                )
                            );

                        tiktokDuration =
                            Math.max(
                                0,
                                Number(
                                    message.value.duration || 0
                                )
                            );

                        reportExternalTelemetry(
                            tiktokCurrentTime,
                            tiktokDuration,
                            0
                        );
                    }

                    break;

                case "onPlayerError":
                    console.error(
                        "TikTok player error:",
                        message.value
                    );

                    reportState("error");
                    break;
            }
        }
    );

    window.onYouTubeIframeAPIReady = function () {
        ytApiReady = true;
        ytApiLoading = false;

        if (pendingYouTubeLoad) {
            const pending = pendingYouTubeLoad;
            pendingYouTubeLoad = null;

            performYouTubeLoad(
                pending.request,
                true,
                pending.usePrivacyHost
            );
        }
    };

    setInterval(syncPlayerCommand, 125);
    setInterval(syncFromStreamerBot, 500);
    setInterval(updateTimeline, 250);
    setInterval(reportTelemetry, 500);
    setInterval(checkPlaybackLimit, 250);
</script>
</body>
</html>
