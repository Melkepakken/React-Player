<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update React Player</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/site.css">
    <style>
        .update-page { width: min(560px, calc(100% - 32px)); margin: 40px auto; padding: clamp(22px, 5vw, 36px); border: 1px solid var(--border); border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); }
        .update-page h1 { font-size: clamp(30px, 7vw, 42px); letter-spacing: -.035em; }
        .update-page h2 { margin: 12px 0 22px; color: var(--muted); font-size: 18px; letter-spacing: 0; }
        .update-page .button { min-height: 44px; font-size: 15px; }
        .update-page ol { margin: 24px 0; padding-left: 22px; }
        .update-page li + li { margin-top: 10px; }
        .update-note { margin: 0; font-size: 13px; }
    </style>
</head>
<body>
<main class="update-page">
    <h1>Update React Player</h1>
    <h2>Streamer.bot update</h2>
    <a class="button primary" href="/downloads/React-Player-Control-Update.txt" download="React-Player-Control-Update.txt">Download update</a>
    <ol>
        <li>Download the update.</li>
        <li>Import it in Streamer.bot.</li>
        <li>Overwrite <strong>React Player: Control</strong>.</li>
    </ol>
    <p class="update-note">Renamed React Player: Control? Rename it back first.</p>
</main>
</body>
</html>
